[project]
name = "kronos"
version = "0.1.0"
description = "A Foundation Model for the Language of Financial Markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "torch>=2.0.0",
  "einops==0.8.1",
  "huggingface_hub==0.33.1",
  "matplotlib==3.9.3",
  "pandas==2.2.2",
  "tqdm==4.67.1",
  "safetensors==0.6.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
webui = [
  "flask==2.3.3",
  "flask-cors==4.0.0",
  "plotly==5.17.0",
]
finetune = [
  "pyqlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.uv]
package = true
